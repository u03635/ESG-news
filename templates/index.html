<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG NEWS 小幫手</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Markdown 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 深色模式色彩系統設計 */
        :root {
            --bg-layer-0: #121212; /* 第 0 層：最底層背景 */
            --bg-layer-1: #1E1E1E; /* 第 1 層：卡片 / 容器 */
            --bg-layer-2: #2C2C2C; /* 第 2 層：互動元素 / 對話框 */
            --bg-layer-3: #383838; /* 第 3 層：懸停狀態 / 最上層 */
            
            --text-primary: rgba(255, 255, 255, 0.87);   /* 主要文字 */
            --text-secondary: rgba(255, 255, 255, 0.60); /* 次要文字 */
            --text-disabled: rgba(255, 255, 255, 0.38);  /* 停用文字 */
            
            --accent-color: #81C784; /* 降飽和度的柔和綠色 (強調色) */
            --accent-hover: #A5D6A7;
            --accent-dark: #388E3C;  /* 用於按鈕或使用者對話框底色 */
        }

        body { 
            background-color: var(--bg-layer-0); 
            color: var(--text-primary);
            /* 依據深色模式特性，調降字重至 350 / 400 避免光暈效應 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 350; 
            margin: 0;
            padding: 0;
        }

        /* 頂部標題列與右上警語 */
        .top-navbar {
            background-color: var(--bg-layer-1);
            border-bottom: 1px solid var(--bg-layer-2);
            padding: 12px 24px;
        }
        .navbar-title {
            color: var(--accent-color);
            font-weight: 500;
        }
        .warning-badge {
            background-color: rgba(255, 213, 79, 0.15); /* 柔和黃色背景 */
            color: #FFD54F; /* 降飽和黃色文字 */
            border: 1px solid rgba(255, 213, 79, 0.3);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: inline-block;
        }

        /* 左右兩側卡片 */
        .sidebar-card, .main-card {
            background: var(--bg-layer-1);
            border-radius: 10px;
            border: 1px solid var(--bg-layer-2);
            padding: 18px;
            height: calc(100vh - 100px);
        }
        
        /* 左側功能選單 */
        .btn-topic {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 400;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid var(--bg-layer-3);
            background-color: var(--bg-layer-2);
            color: var(--text-primary);
        }
        .btn-topic:hover {
            background-color: var(--bg-layer-3);
            color: var(--text-primary);
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        /* 右側主顯示區域 */
        .main-card {
            display: flex;
            flex-direction: column;
        }
        .content-box {
            flex-grow: 1;
            overflow-y: auto;
            background: var(--bg-layer-1);
            padding: 15px;
            border-radius: 8px;
        }
        
        /* 對話氣泡設計 */
        .msg-bot {
            background-color: var(--bg-layer-2);
            border-left: 4px solid var(--accent-color);
            padding: 16px 20px;
            border-radius: 6px;
            color: var(--text-primary);
            line-height: 1.65;
            margin-bottom: 15px;
            font-weight: 350;
        }
        .msg-user {
            background-color: var(--accent-dark);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: inline-block;
            float: right;
            clear: both;
            font-weight: 400;
        }

        /* 輔助文字色彩設定 */
        .text-secondary-custom { color: var(--text-secondary) !important; }
        
        /* 資料來源超連結樣式 */
        .content-box a {
            color: var(--accent-color);
            text-decoration: underline;
            font-weight: 400;
        }
        .content-box a:hover {
            color: var(--accent-hover);
        }

        /* 輸入框與發送按鈕 */
        input.form-control {
            background-color: var(--bg-layer-2);
            border: 1px solid var(--bg-layer-3);
            color: var(--text-primary);
        }
        input.form-control::placeholder {
            color: var(--text-disabled);
        }
        input.form-control:focus {
            background-color: var(--bg-layer-2);
            color: var(--text-primary);
            border-color: var(--accent-color);
            box-shadow: none;
        }
        .btn-send {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-layer-0); /* 確保與按鈕底色達高對比 */
            font-weight: 500;
        }
        .btn-send:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--bg-layer-0);
        }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>
    <!-- 頂部導覽列 -->
    <div class="top-navbar d-flex justify-content-between align-items-center">
        <h4 class="m-0 navbar-title">🏢 ESG NEWS 小幫手</h4>
        <div class="warning-badge">
            ⚠️ <strong>貼心提醒：</strong>AI 整理資訊可能存在誤差，正式法規與標章細節請以主管機關最新公告為準。
        </div>
    </div>

    <div class="container-fluid px-4 py-3">
        <div class="row g-3">
            <!-- 左側按鈕選單 -->
            <div class="col-md-3 col-lg-3">
                <div class="sidebar-card">
                    <h6 class="text-secondary-custom fw-bold mb-3">📌 法規專題快速分析</h6>
                    <button class="btn btn-topic" onclick="requestTopic('即時法規與新制快報')">📢 即時法規與新制快報</button>
                    <button class="btn btn-topic" onclick="requestTopic('新舊法規差異分析')">⚖️ 新舊法規差異分析</button>
                    <button class="btn btn-topic" onclick="requestTopic('產業影響評估-開發中')">🏢 產業影響評估-開發中</button>

                    <hr class="my-4 border-secondary">
                    <div class="text-secondary-custom small">
                        <strong>操作說明：</strong><br>
                        選擇上方專題，系統將連網檢索最新資訊並產出報告。所有報告末端皆附帶原始資料超連結。
                    </div>
                </div>
            </div>

            <!-- 右側主顯示區 -->
            <div class="col-md-9 col-lg-9">
                <div class="main-card">
                    <div class="content-box mb-3 clearfix" id="chatBox">
                        <div class="msg-bot">
                            <h5 style="color: var(--accent-color); font-weight: 500;">👋 歡迎使用 ESG NEWS 小幫手！</h5>
                            <p class="mb-1 text-secondary-custom">請從<strong>左側點選您想查閱的主題</strong>，或在下方直接輸入查詢內容。</p>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" id="userInput" class="form-control" placeholder="輸入法規名稱或詢問相關細節..." onkeydown="if(event.key==='Enter') sendMessage()">
                        <button class="btn btn-send px-4" onclick="sendMessage()">送出</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        let currentMode = 'normal'; // 用於追蹤當前對話狀態

        // 設定 marked.js 連結開新分頁
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a target="_blank" rel="noopener noreferrer" href="${href}" title="${title || ''}">${text}</a>`;
        };
        marked.setOptions({ renderer: renderer });

        // 點選左側按鈕邏輯
        async function requestTopic(topicName) {
            if (topicName === '產業影響評估-開發中') {
                appendMessage('user', `請分析：【${topicName}】`);
                appendMessage('bot', `功能開發中，敬請期待。`);
                return;
            }

            if (topicName === '新舊法規差異分析') {
                appendMessage('user', `請執行：【${topicName}】`);
                appendMessage('bot', `請問您想分析什麼法規？<br><span style="color: var(--accent-color);">👉 請在下方輸入欄位填入「法規名稱」並送出。</span>`);
                currentMode = 'waiting_for_regulation'; // 進入等待法規名稱模式
                document.getElementById('userInput').focus();
                return;
            }

            if (topicName === '即時法規與新制快報') {
                appendMessage('user', `請整理分析：【${topicName}】`);
                await fetchAndDisplay('/topic', { topic: topicName }, `檢索近 12 個月最新法規動態中，請稍候...`);
            }
        }

        // 下方輸入框手動查詢
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if(!message) return;

            appendMessage('user', message);
            input.value = '';

            // 判斷目前系統狀態，若在等待法規名稱，則呼叫專屬路由
            if (currentMode === 'waiting_for_regulation') {
                currentMode = 'normal'; // 恢復一般模式
                await fetchAndDisplay('/analyze_diff', { regulation: message }, `正在分析法規「${message}」的新舊差異，請稍候...`);
            } else {
                await fetchAndDisplay('/query', { message: message }, `檢索即時資料並分析中...`);
            }
        }

        // 共通的 API 呼叫與渲染函數
        async function fetchAndDisplay(endpoint, payload, loadingText) {
            const thinkingId = 'thinking-' + Date.now();
            chatBox.innerHTML += `<div id="${thinkingId}" class="msg-bot"><div class="spinner-border spinner-border-sm" style="color: var(--accent-color);"></div><span class="ms-2">${loadingText}</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                document.getElementById(thinkingId).remove();

                if (data.error) {
                    // 根據後端回傳的特定錯誤碼，顯示對應的文字
                    if (data.error === "QUOTA_EXCEEDED") {
                        appendMessage('bot', `<span class="text-danger">免費額度用完</span>`);
                    } else {
                        appendMessage('bot', `<span class="text-danger">連線失敗</span>`);
                    }
                } else {
                    appendMessage('bot', marked.parse(data.response));
                }
            } catch (e) {
                document.getElementById(thinkingId).remove();
                // 處理網路斷線、伺服器超時等無法解析 JSON 的情況
                appendMessage('bot', `<span class="text-danger">連線失敗</span>`);
            }
        }

        function appendMessage(sender, htmlContent) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'msg-user' : 'msg-bot';
            div.innerHTML = htmlContent;
            chatBox.appendChild(div);
            
            const clearFix = document.createElement('div');
            clearFix.className = 'clearfix';
            chatBox.appendChild(clearFix);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
