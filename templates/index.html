<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG NEWS 小幫手</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Markdown 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* 頂部標題列與右上警語 */
        .top-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e6ed;
            padding: 12px 24px;
        }
        .warning-badge {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: inline-block;
        }
        /* 左側功能選單 */
        .sidebar-card {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #dbe2ea;
            padding: 18px;
            height: calc(100vh - 100px);
        }
        .btn-topic {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid #c3e6cb;
            background-color: #f8fbf9;
            color: #155724;
        }
        .btn-topic:hover {
            background-color: #2b9348;
            color: #ffffff;
            border-color: #2b9348;
            transform: translateY(-1px);
        }
        /* 右側主顯示區域（對應藍框，全螢幕放大） */
        .main-card {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #dbe2ea;
            padding: 18px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }
        .content-box {
            flex-grow: 1;
            overflow-y: auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
        }
        .msg-bot {
            background-color: #f8f9fa;
            border-left: 4px solid #2b9348;
            padding: 16px 20px;
            border-radius: 6px;
            color: #2d3748;
            line-height: 1.65;
            margin-bottom: 15px;
        }
        .msg-user {
            background-color: #2b9348;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: inline-block;
            float: right;
            clear: both;
        }
        /* 資料來源超連結樣式 */
        .content-box a {
            color: #1e7e34;
            text-decoration: underline;
            font-weight: 500;
        }
        .content-box a:hover {
            color: #155724;
        }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>
    <!-- 頂部導覽列：標題 + 右上角警語 -->
    <div class="top-navbar d-flex justify-content-between align-items-center">
        <h4 class="m-0 text-success fw-bold">🏢 ESG NEWS 小幫手</h4>
        <div class="warning-badge">
            ⚠️ <strong>貼心提醒：</strong>AI 整理資訊僅供參考，正式法規與標章規定請以主管機關最新公告為準。
        </div>
    </div>

    <!-- 寬版工作區：左側紅框選單 + 右側藍框內容區 -->
    <div class="container-fluid px-4 py-3">
        <div class="row g-3">
            <!-- 左側按鈕選單 (原左側紅框) -->
            <div class="col-md-3 col-lg-3">
                <div class="sidebar-card">
                    <h6 class="text-secondary fw-bold mb-3">📌 法規專題快速分析</h6>
                    <button class="btn btn-topic" onclick="requestTopic('即時法規與新制快報')">
                        📢 即時法規與新制快報
                    </button>
                    <button class="btn btn-topic" onclick="requestTopic('新舊法規差異分析')">
                        ⚖️ 新舊法規差異分析
                    </button>
                    <button class="btn btn-topic" onclick="requestTopic('產業影響評估')">
                        🏢 產業影響評估
                    </button>

                    <hr class="my-4 text-muted">
                    <div class="text-muted small">
                        <strong>使用說明：</strong><br>
                        點選上方主題，小幫手將即時連網檢索最新 BERS 建築能效與綠建築法規資料，並附上最新新聞與公告來源連結。
                    </div>
                </div>
            </div>

            <!-- 右側大型顯示區 (原藍框放大區域) -->
            <div class="col-md-9 col-lg-9">
                <div class="main-card">
                    <div class="content-box mb-3 clearfix" id="chatBox">
                        <!-- 預設歡迎畫面 (不再自動搜尋) -->
                        <div class="msg-bot">
                            <h5 class="text-success fw-bold">👋 歡迎使用 ESG NEWS 小幫手！</h5>
                            <p class="mb-1">請從<strong>左側點選您想查閱的主題</strong>進行深度分析，或在下方輸入框直接發問。</p>
                            <span class="badge bg-light text-secondary border">支援即時連網搜尋</span>
                            <span class="badge bg-light text-secondary border">附帶原始法規超連結</span>
                        </div>
                    </div>

                    <!-- 下方輸入框 -->
                    <div class="input-group">
                        <input type="text" id="userInput" class="form-control" placeholder="輸入你想特別查詢的建築能效/綠建築法規細節..." onkeydown="if(event.key==='Enter') sendMessage()">
                        <button class="btn btn-success px-4" onclick="sendMessage()">查詢與分析</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');

        // 設定 marked.js：讓所有產出的連結都在「新分頁開啟」
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a target="_blank" rel="noopener noreferrer" href="${href}" title="${title || ''}">${text}</a>`;
        };
        marked.setOptions({ renderer: renderer });

        // 點選左側 3 個專題按鈕觸發
        async function requestTopic(topicName) {
            appendMessage('user', `請整理分析：【${topicName}】`);

            const thinkingId = 'thinking-' + Date.now();
            chatBox.innerHTML += `<div id="${thinkingId}" class="msg-bot"><div class="spinner-border text-success spinner-border-sm"></div><span class="ms-2">正連網檢索最新資訊並整理「${topicName}」中，請稍候...</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/topic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topicName })
                });
                const data = await response.json();
                document.getElementById(thinkingId).remove();

                if (data.error) {
                    appendMessage('bot', `<span class="text-danger">系統錯誤：${data.error}</span>`);
                } else {
                    appendMessage('bot', marked.parse(data.response));
                }
            } catch (e) {
                document.getElementById(thinkingId).remove();
                appendMessage('bot', `<span class="text-danger">連線失敗，請檢查網路狀況。</span>`);
            }
        }

        // 下方輸入框手動查詢
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if(!message) return;

            appendMessage('user', message);
            input.value = '';

            const thinkingId = 'thinking-' + Date.now();
            chatBox.innerHTML += `<div id="${thinkingId}" class="msg-bot"><div class="spinner-border text-success spinner-border-sm"></div><span class="ms-2">檢索即時資料並分析中...</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                document.getElementById(thinkingId).remove();

                if (data.error) {
                    appendMessage('bot', `<span class="text-danger">系統錯誤：${data.error}</span>`);
                } else {
                    appendMessage('bot', marked.parse(data.response));
                }
            } catch (e) {
                document.getElementById(thinkingId).remove();
                appendMessage('bot', `<span class="text-danger">連線失敗</span>`);
            }
        }

        function appendMessage(sender, htmlContent) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'msg-user' : 'msg-bot';
            div.innerHTML = htmlContent;
            chatBox.appendChild(div);
            
            const clearFix = document.createElement('div');
            clearFix.className = 'clearfix';
            chatBox.appendChild(clearFix);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
