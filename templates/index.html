<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG 建築能效法規雷達</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- 用於解析 Markdown -->
    <style>
        body { background-color: #f0f4f8; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .chat-box { height: 60vh; overflow-y: auto; background: white; border-radius: 10px; padding: 20px; border: 1px solid #cce3de; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .msg-bot { background-color: #eaf4f4; padding: 15px; border-radius: 10px; margin-bottom: 15px; color: #333; }
        .msg-user { background-color: #2b9348; color: white; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; text-align: right; display: inline-block; float: right; clear: both; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="text-success mb-3 text-center">🏢 ESG 建築能效法規雷達</h2>
        <div class="card p-3 shadow-sm border-0">
            <div class="chat-box mb-3 clearfix" id="chatBox">
                <!-- 載入動畫 -->
                <div id="loading" class="msg-bot text-center">
                    <div class="spinner-border text-success spinner-border-sm" role="status"></div>
                    <span class="ms-2">系統正在為您聯網搜尋最新的 BERS 與綠建築法規動態，請稍候...</span>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="userInput" class="form-control" placeholder="輸入你想查詢的綠建築/能效法規問題...">
                <button class="btn btn-success" onclick="sendMessage()">查詢與分析</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        
        // 【核心功能】：網頁一打開，立刻發送請求抓取最新法規
        window.onload = async function() {
            try {
                const response = await fetch('/auto_update');
                const data = await response.json();
                document.getElementById('loading').style.display = 'none'; // 隱藏載入中
                
                if (data.error) {
                    appendMessage('bot', `系統錯誤：${data.error}`);
                } else {
                    // 解析 Markdown 並顯示
                    appendMessage('bot', marked.parse(data.response));
                }
            } catch (e) {
                document.getElementById('loading').innerHTML = "<span class='text-danger'>無法連線獲取最新法規，請檢查網路。</span>";
            }
        };

        // 處理使用者手動輸入
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if(!message) return;

            appendMessage('user', message);
            input.value = '';

            // 顯示思考中
            const thinkingId = 'thinking-' + Date.now();
            chatBox.innerHTML += `<div id="${thinkingId}" class="msg-bot"><div class="spinner-border text-success spinner-border-sm"></div><span class="ms-2">檢索最新資料並分析中...</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                document.getElementById(thinkingId).remove();
                
                if (data.error) {
                    appendMessage('bot', `系統錯誤：${data.error}`);
                } else {
                    appendMessage('bot', marked.parse(data.response));
                }
            } catch (e) {
                document.getElementById(thinkingId).remove();
                appendMessage('bot', `<span class="text-danger">連線失敗</span>`);
            }
        }

        function appendMessage(sender, htmlContent) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'msg-user' : 'msg-bot';
            div.innerHTML = htmlContent;
            chatBox.appendChild(div);
            // 清除浮動並捲動到底部
            const clearFix = document.createElement('div');
            clearFix.className = 'clearfix';
            chatBox.appendChild(clearFix);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
